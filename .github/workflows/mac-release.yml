name: Mac Release

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/mac-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.build/mac/DerivedData
      APP_PATH: ${{ github.workspace }}/.build/mac/DerivedData/Build/Products/Release-maccatalyst/Gogai.app
      DMG_PATH: ${{ github.workspace }}/.build/mac/Gogai.dmg
      ZIP_PATH: ${{ github.workspace }}/.build/mac/Gogai.zip
    steps:
      - uses: actions/checkout@v5

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Sync app icons
        run: |
          cp appiconset/*.png Gogai/Assets.xcassets/AppIcon.appiconset/
          rm -f Gogai/Assets.xcassets/AppIcon.appiconset/Icon-App-40x40@1x.png
          cp appiconset/Contents.json Gogai/Assets.xcassets/AppIcon.appiconset/

      # ビルド設定からバージョンを解決する(実ビルド前。ビルドを走らせずに済む)
      # MARKETING_VERSION は xx.xx.xx 形式(セマンティックバージョニング)で管理する。
      - name: Resolve version
        id: ver
        run: |
          SETTINGS=$(xcodebuild -showBuildSettings \
            -project Gogai.xcodeproj -scheme Gogai -configuration Release \
            -destination "platform=macOS,variant=Mac Catalyst" 2>/dev/null)
          V=$(echo "$SETTINGS" | awk -F'= ' '/ MARKETING_VERSION /{print $2; exit}')
          TAG="v${V}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V, tag: $TAG"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Developer ID 証明書を一時キーチェーンに取り込む
      - name: Import signing certificate
        if: steps.check.outputs.exists == 'false'
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Xcode の自動プロビジョニング管理を経由せず、署名なしでビルドしてから
      # 直接 codesign する(App Group entitlement はサンドボックス化されていないため
      # プロビジョニングプロファイル無しで有効。Xcode 管理プロファイルは
      # CODE_SIGN_STYLE=Manual では使えないため、この方式を採る)。
      - name: Build (unsigned)
        if: steps.check.outputs.exists == 'false'
        run: |
          xcodebuild build \
            -project Gogai.xcodeproj \
            -scheme Gogai \
            -configuration Release \
            -destination "platform=macOS,variant=Mac Catalyst" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Codesign with Developer ID
        if: steps.check.outputs.exists == 'false'
        run: |
          codesign --force --deep --options runtime \
            --entitlements Gogai/Gogai.entitlements \
            --sign "Developer ID Application: Masaki TAKAGI (G72M73C546)" \
            "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      # notarize は .app 自体に対して1回だけ行い、チケットを .app に staple する。
      # dmg / zip はこの stapled 済み .app から作るため、それぞれの個別 notarize は不要。
      # ただし dmg 自体への staple はできない(dmg 単体を notarize していないと
      # "CloudKit query ... Record not found" になる)。Gatekeeper は起動時に
      # 実行ファイル(.app)側の staple 済みチケットを見るため、dmg 側は未 staple で問題ない。
      - name: Notarize and staple app
        if: steps.check.outputs.exists == 'false'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          NOTARIZE_ZIP="$RUNNER_TEMP/Gogai-notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Create DMG
        if: steps.check.outputs.exists == 'false'
        run: bash Scripts/make-dmg.sh "$APP_PATH" "Gogai" "$DMG_PATH"

      # アプリ内自動更新機能(UpdateChecker)が展開する配布用 zip。
      # stapled 済みの .app をそのまま zip 化するため、展開後もオフラインで Gatekeeper を通過できる。
      - name: Create update zip
        if: steps.check.outputs.exists == 'false'
        run: ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gogai ${{ steps.ver.outputs.version }} (macOS)" \
            --generate-notes \
            "$DMG_PATH" "$ZIP_PATH"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$SIGN_KEYCHAIN" || true
