services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - db-data:/app/data
    environment:
      - PORT=3040
      - DB_PATH=/app/data/rss.db
    healthcheck:
      # localhost だとコンテナ内で ::1(IPv6)に解決されることがあり、
      # サーバーは 0.0.0.0(IPv4)でしか listen していないため接続拒否になる。
      # 127.0.0.1 を明示して IPv4/IPv6 解決の揺れを避ける。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3040/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # nginx がバックエンドへリバースプロキシするので /api をそのまま使う
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
